version: "3.9"

# ══════════════════════════════════════════════════════════════════
#  Site institucional da GR Cartuchos (grcartuchos.com.br)
#  WordPress + WooCommerce + Elementor, migrado da HostGator em 2026-09-07.
#
#  Roda na mesma VPS do Zap Agenda/ZapAtende, mas é um produto totalmente
#  separado (site institucional da empresa-mãe, não o SaaS) — por isso vive
#  no seu próprio repositório em vez de dentro de zap-agenda/.
#
#  Reaproveita a rede Docker e os volumes que já existiam quando esses
#  serviços foram criados dentro do docker-compose.yml do zap-agenda (por
#  isso os nomes "externos" abaixo têm o prefixo zap-agenda_) — e depende
#  do nginx compartilhado do zap-agenda (zap_nginx) para expor HTTPS, já
#  que só uma VPS/porta 80-443 existe. Ver README.md para o fluxo completo.
# ══════════════════════════════════════════════════════════════════

services:
  wordpress:
    image: wordpress:php8.2-apache
    container_name: zap_wordpress
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST:     mysql
      WORDPRESS_DB_NAME:     ${MYSQL_DATABASE}
      WORDPRESS_DB_USER:     ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      # Site real migrado da HostGator usa esse prefixo — não é o padrão wp_.
      WORDPRESS_TABLE_PREFIX: wpga_
    volumes:
      - zap_wp_data:/var/www/html
      - ./wordpress/php-overrides.ini:/usr/local/etc/php/conf.d/zzz-overrides.ini:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - zap_net

  mysql:
    image: mysql:8.0
    container_name: zap_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    volumes:
      - zap_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - zap_net

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: gr_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 512M
    # Deliberately bound to the VPS loopback interface. Access it from a
    # workstation through an SSH tunnel; never expose phpMyAdmin publicly.
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - zap_net

  pdv:
    build:
      context: .
      dockerfile: wordpress/Dockerfile.pdv
    container_name: gr_pdv
    restart: unless-stopped
    environment:
      PDV_DB_HOST: mysql
      PDV_DB_USER: ${PDV_DB_USER}
      PDV_DB_PASSWORD: ${PDV_DB_PASSWORD}
      PDV_MATRIX_DB: sistem84_matriz
      PDV_DEFAULT_DB: sistem84_impressoras
    volumes:
      # Production code is copied directly to the VPS and deliberately ignored
      # by Git because legacy PHP files contain database credentials.
      - ./pdv:/var/www/html
    ports:
      # Temporary preview only. Public traffic remains on HostGator until the
      # migrated copy has been tested and the DNS record is changed.
      - "127.0.0.1:8084:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - zap_net

  code-server:
    image: codercom/code-server:4.133.0
    container_name: gr_code_server
    restart: unless-stopped
    user: "0:0"
    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD}
      DOCKER_USER: root
      DEFAULT_WORKSPACE: /home/coder/project
    volumes:
      # Only the two requested application trees are writable. Secrets,
      # database dumps and the Docker socket are intentionally not mounted.
      - zap_wp_data:/home/coder/project/site-wordpress
      - ./pdv:/home/coder/project/pdv
      - ./code-server:/root/.local/share/code-server
    ports:
      - "127.0.0.1:8085:8080"
    networks:
      - zap_net

# ── Volumes ──────────────────────────────────────────────────────────
# external + name explícito: são os MESMOS volumes já criados quando esses
# containers ainda viviam dentro do docker-compose.yml do zap-agenda —
# aponta pra eles em vez de criar volumes novos vazios, senão o site e o
# banco migrados hoje "sumiriam" (ficariam presos no volume antigo).
volumes:
  zap_wp_data:
    external: true
    name: zap-agenda_zap_wp_data
  zap_mysql_data:
    external: true
    name: zap-agenda_zap_mysql_data

# ── Rede ─────────────────────────────────────────────────────────────
# Mesma rede do zap-agenda — é assim que o nginx compartilhado (zap_nginx,
# no outro repositório) consegue alcançar "zap_wordpress:80" por nome.
networks:
  zap_net:
    external: true
    name: zap-agenda_zap_net
