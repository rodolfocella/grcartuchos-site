name: Gerar Coletores Windows e macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collectors/**"
      - ".github/workflows/build-coletor-windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: "0"

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r collectors/requirements.txt

      - name: Incorporar Chromium
        run: python -m playwright install chromium

      - name: Gerar ColetorGR.exe
        working-directory: collectors
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --noconsole
          --onefile
          --name ColetorGR
          coletor_multimodelo_api.py

      - name: Montar pacote de instalação
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacote
          Copy-Item collectors/dist/ColetorGR.exe pacote/ColetorGR.exe
          Copy-Item collectors/instalar_coletor.bat pacote/instalar_coletor.bat

      - name: Disponibilizar para download
        uses: actions/upload-artifact@v4
        with:
          name: ColetorGR-Windows
          path: pacote/*
          if-no-files-found: error

  build-macos-intel:
    # Este Mac é Intel (x86_64). O label específico evita gerar um aplicativo
    # ARM incompatível com ele.
    runs-on: macos-15-intel

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collectors/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r collectors/requirements.txt

      - name: Gerar aplicativo macOS Intel
        working-directory: collectors
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --windowed
          --onedir
          --name ColetorGR-macOS
          coletor_multimodelo_api.py

      - name: Compactar aplicativo
        working-directory: collectors/dist
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          ColetorGR-macOS.app
          ColetorGR-macOS.zip

      - name: Disponibilizar para download
        uses: actions/upload-artifact@v4
        with:
          name: ColetorGR-macOS-Intel
          path: collectors/dist/ColetorGR-macOS.zip
          if-no-files-found: error
