# phpMyAdmin (gr_phpmyadmin) e code-server (gr_code_server) — painéis internos
# de administração, antes só acessíveis por túnel SSH (127.0.0.1:8083/8085).
# Expostos aqui pra acesso direto pelo navegador, igual o Portainer do
# zap-agenda. TEMPORÁRIO: ainda sem DNS real, só HTTP puro até o certbot
# poder validar. phpMyAdmin tem uma segunda camada (HTTP Basic Auth via
# nginx/htpasswd_pma) além do login do próprio banco, porque dá acesso total
# a dados reais de clientes — alvo comum de bots de varredura na internet.
server {
  listen 80;
  server_name phpmyadmin.grcartuchos.com.br;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 80;
  server_name code-server.grcartuchos.com.br;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name phpmyadmin.grcartuchos.com.br;

  ssl_certificate     /etc/letsencrypt/live/phpmyadmin.grcartuchos.com.br-0001/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/phpmyadmin.grcartuchos.com.br-0001/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 512m;

  auth_basic           "Acesso restrito";
  auth_basic_user_file /etc/nginx/sites/htpasswd_pma;

  location / {
    proxy_pass         http://phpmyadmin:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name code-server.grcartuchos.com.br;

  # Certificado emitido com SAN cobrindo phpmyadmin.* e code-server.* juntos
  # (pasta com sufixo -0001 porque já existia um certificado anterior com
  # esse mesmo nome principal) — por isso aponta pra essa pasta mesmo aqui.
  ssl_certificate     /etc/letsencrypt/live/phpmyadmin.grcartuchos.com.br-0001/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/phpmyadmin.grcartuchos.com.br-0001/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  location / {
    proxy_pass         http://code-server:8080;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
  }
}
