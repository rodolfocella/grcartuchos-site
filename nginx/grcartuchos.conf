# ── GR Cartuchos — grcartuchos.com.br / www ───────────────────────
# Este arquivo é montado dentro do container zap_nginx (definido no
# repositório zap-agenda, que roda o único nginx compartilhado da VPS) via
# um bind mount apontando pra esse caminho no host. Ver README.md.
#
# TEMPORÁRIO (2026-09-07): ainda sem DNS real apontando pra cá, então sem
# certificado ainda — só HTTP puro, testado via `curl --resolve` direto no
# IP da VPS. Trocar pelo bloco 443 comentado abaixo assim que o DNS real
# for migrado e o certbot puder validar o domínio.
server {
  listen 80;
  server_name grcartuchos.com.br www.grcartuchos.com.br;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# API dos coletores de contadores. Enquanto o certificado ainda não existir,
# o HTTP serve somente o desafio ACME; dados nunca são aceitos sem HTTPS.
server {
  listen 80;
  server_name api.grcartuchos.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Painel/webmail do Poste.io (gr_mail, ver docker-compose.yml).
server {
  listen 80;
  server_name webmail.grcartuchos.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# mail.grcartuchos.com.br é o alvo real do MX e o hostname que apps de
# e-mail (celular) usam pra conectar direto nas portas IMAP/SMTP do gr_mail
# — essas portas não passam por esse nginx (são TCP cru, publicadas direto
# pelo container). Esse bloco existe só pra emitir/renovar o certificado
# Let's Encrypt via desafio HTTP, que depois é copiado manualmente pra
# dentro do gr_mail (/data/ssl/) — ver CLAUDE.md, seção "E-mail".
server {
  listen 80;
  server_name mail.grcartuchos.com.br;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://webmail.grcartuchos.com.br$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name webmail.grcartuchos.com.br;

  ssl_certificate     /etc/letsencrypt/live/webmail.grcartuchos.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/webmail.grcartuchos.com.br/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 50m;

  location / {
    proxy_pass         http://mail:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.grcartuchos.com.br;

  ssl_certificate     /etc/letsencrypt/live/api.grcartuchos.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.grcartuchos.com.br/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 16k;

  location = /contador {
    proxy_pass         http://gr_pdv:80/api/contador.php;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name grcartuchos.com.br www.grcartuchos.com.br;

  ssl_certificate     /etc/letsencrypt/live/grcartuchos.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/grcartuchos.com.br/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  location / {
    proxy_pass         http://zap_wordpress:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
  }
}

